[project]
name = "radar-backend"
version = "0.1.0"
description = "RADAR 2.0 공통 백엔드 (FastAPI 서버 하나에 기능별 API)"
requires-python = ">=3.11,<3.14"
# 모두가 설치하는 기본 묶음: 공통 서버 + AI-05 + AI-07 + AI-10
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "pymysql>=1.1,<2",          # 공통 DB 연결 (app/core/db.py)
    "cryptography>=42",         # MySQL 8 기본 인증(caching_sha2_password)에 필요
    "google-genai>=2.31.0",     # AI-10 Gemini
    "olefile>=0.47",            # AI-05 hwp 원문 읽기 (색인 다시 만들 때)
    "rank-bm25>=0.2.2",         # AI-05 검색
    "kiwipiepy>=0.20",          # AI-05 한국어 형태소
]

# 필요한 사람만 설치하는 선택 묶음 (예: uv sync --extra ai03)
[project.optional-dependencies]
ai03 = [                        # AI-03 위치 글자 다듬기 배치 (세은)
    "pandas>=2",
    "numpy>=1.26",
    "requests>=2.31",
    "openai>=1.40",             # Ollama 호환 호출용
]
ai01 = []                       # AI-01 민원 정제 (규림) — torch·transformers 등 확정되면 여기에

[dependency-groups]
dev = [
    "httpx>=0.27",              # FastAPI TestClient
    "pytest>=8",
]

[tool.uv]
package = false
